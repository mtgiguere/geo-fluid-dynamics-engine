name: Deploy

# The deployment gate (TDD_CONTRACT.md, Bug #8): the Playwright suite runs
# against the PRODUCTION build at the REAL Pages base path in a real browser
# before anything ships. If it fails, nothing deploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  e2e-gate:
    runs-on: ubuntu-latest
    env:
      # Public Mapbox token (pk.*) — a repository Actions VARIABLE named
      # VITE_MAPBOX_TOKEN is the intended home (it's public by design), but
      # the UI makes Secrets the easy default, so either location works.
      # URL-restrict the token to the Pages domain in the Mapbox dashboard.
      VITE_MAPBOX_TOKEN: ${{ vars.VITE_MAPBOX_TOKEN || secrets.VITE_MAPBOX_TOKEN }}
      CI: true
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Fail in one second with a clear message rather than a 30-second
      # Playwright timeout: without the token the map style never loads and
      # the status bar stays at "loading…" (failure signature reproduced
      # locally 2026-06-11).
      - name: Require Mapbox token
        run: |
          if [ -z "$VITE_MAPBOX_TOKEN" ]; then
            echo "::error::VITE_MAPBOX_TOKEN is empty. Add it under Settings -> Secrets and variables -> Actions (either tab) with your public pk.* token."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Builds the production bundle at the Pages base path (the Playwright
      # webServer config sets GFDE_BASE), serves it, and runs the golden
      # paths against it. The dist/ this produces is what gets deployed.
      - name: E2E against production build
        run: npx playwright test

      # On failure, keep the Playwright report + traces — CI logs alone are
      # not downloadable anonymously, and blind debugging wastes runs.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: e2e-gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
