name: Mutation testing

# The watchdog for hollow tests (TDD_CONTRACT.md Bug #5): coverage measures
# which lines EXECUTED; mutation score measures which tests actually FAIL when
# the code is wrong. Report-only — surviving mutants are work items, never a
# build failure.
#
# Self-running by design: a cron alone proved unreliable (GitHub skips
# schedules on quiet repos — it had zero runs in three days, the "a guardrail
# that has never run is decoration" lesson). So it ALSO runs on every push to
# main that touches code, plus a weekly backstop and manual dispatch. Results
# are written to the run's job summary so the score is visible without digging
# through logs, and the full output is uploaded as an artifact.
#
# Note: mutmut refuses to run on Windows (the dev box), so this Linux job is
# the ONLY place it executes — it cannot be validated locally.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC backstop
  workflow_dispatch:

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run mutation testing (report-only)
        run: uv run mutmut run 2>&1 | tee mutmut_run.log || true

      - name: Collect survivor diffs (actionable, not just opaque IDs)
        if: always()
        run: |
          uv run mutmut results 2>/dev/null | awk '/: survived/{print $1}' > survivors.txt || true
          : > survivor_diffs.txt
          # Cap the per-mutant `show` loop so the report stays bounded in time;
          # the count line below records the true total.
          head -80 survivors.txt | while read -r m; do
            [ -z "$m" ] && continue
            echo "===== $m =====" >> survivor_diffs.txt
            uv run mutmut show "$m" >> survivor_diffs.txt 2>&1 || true
          done

      - name: Publish score + survivor diffs to job summary
        if: always()
        run: |
          {
            echo "## Mutation testing"
            echo ""
            echo "Surviving mutants: **$(wc -l < survivors.txt 2>/dev/null || echo '?')**"
            echo ""
            echo "<details><summary>Survivor diffs (first 80)</summary>"
            echo ""
            echo '```diff'
            head -300 survivor_diffs.txt 2>/dev/null || true
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutmut-results
          path: |
            mutmut_run.log
            survivors.txt
            survivor_diffs.txt
          retention-days: 14
