name: CI

# The Python and web quality gates moved to qa.yml (central reusable
# workflows in mtgiguere/qa_pipeline), validated in lockstep with the old
# in-repo jobs across the 2026-08-10 dependabot wave before the duplicates
# were retired. What remains here is only what qa.yml deliberately does
# not cover for this repo:
#   - gitleaks (qa.yml's security job runs with run-gitleaks: false)
#   - uv lock --check (python-qa installs with `uv sync --frozen`, which
#     tolerates a lockfile that drifted from pyproject; this gate does not)
# Deploy-time E2E lives in deploy.yml; mutation testing in mutation.yml.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # No secrets in the history. With a Mapbox account on this project,
  # a leaked token is the single most likely security incident.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Lockfile in sync with pyproject — prevents "works on my machine" drift.
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Check lockfile
        run: uv lock --check
