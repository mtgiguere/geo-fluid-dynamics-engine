[project]
name = "geo-fluid-dynamics-engine"
version = "0.1.0"
description = "Strategic civic simulator: descriptive, predictive, and prescriptive analytics for how political ideas move across geography"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyshp>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6",
    "ruff>=0.16.2",
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
    "pip-audit>=2.7",
    "hypothesis>=6.165.2",
    "mutmut>=3.7.0",
    "pyreadr>=0.5.6",
    "jupytext>=1.19.5",
    "matplotlib>=3.11.1",
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geofluid"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F/W: core errors and style. I: import sorting. UP: modern syntax.
# B: bugbear (likely bugs). S: bandit security rules — the SAST gate, per CI plan.
# C4: comprehension correctness. PT: pytest style. SIM: simplification.
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "PT", "SIM"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest tests assert by design.
"tests/**" = ["S101"]
# Analysis notebooks (jupytext py:percent) follow notebook idiom, not module style:
# E402 — imports come after the intro markdown cell; B018 — a bare `df` in a cell
# is how a notebook renders a table, not a useless expression.
"notebooks/**" = ["E402", "B018"]

[tool.mypy]
strict = true
files = ["src", "tests"]

# pyshp ships no type stubs and no py.typed marker. Scoped to the one module
# rather than a global ignore so every other dependency stays strictly typed.
[[tool.mypy.overrides]]
module = "shapefile"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--no-header -q"

[tool.mutmut]
# Mutation testing: the watchdog for hollow tests (TDD_CONTRACT.md Bug #5 —
# coverage measures execution, mutation score measures verification).
# Report-only in CI; surviving mutants are work items. mutmut 3.x keys
# (source_paths replaces the deprecated paths_to_mutate; tests are found via
# the [tool.pytest.ini_options] testpaths above).
source_paths = ["src/geofluid"]
