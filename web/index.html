<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inline favicon: avoids a /favicon.ico 404 that would pollute the
         E2E gate's clean-console assertion -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>" />
    <title>Geo-Fluid Dynamics Engine</title>
  </head>
  <body>
    <header id="bar">
      <h1>Geo-Fluid Dynamics Engine</h1>
      <div id="controls">
        <select id="metric" aria-label="Map metric"></select>
        <span id="year-label">2024</span>
        <input id="year" type="range" min="0" max="6" step="1" value="6" />
      </div>
      <div id="legend">
        <span id="legend-left">More Republican</span>
        <div id="ramp"></div>
        <span id="legend-right">More Democratic</span>
      </div>

    <script type="module" src="/src/main.ts"></script>
